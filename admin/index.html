<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Admin | Dory's Bakehouse</title>
<link rel="icon" href="/assets/images/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/assets/images/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=Young+Serif&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/admin/admin.css">
</head>
<body>

<!-- Login -->
<main class="login" id="login" hidden>
  <form class="login-card" id="login-form">
    <img src="/assets/images/logo-192.png" width="88" height="88" alt="" style="display:block;border-radius:50%;margin:0 0 14px">
    <h1>Dory's Bakehouse</h1>
    <p class="muted">Sign in to edit the website.</p>
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password" required>
    <p class="error" id="login-error" role="alert"></p>
    <button class="btn" type="submit">Sign in</button>
  </form>
</main>

<!-- Editor -->
<div class="app" id="app" hidden>
  <header class="topbar">
    <div class="brand">Dory's <span>admin</span></div>
    <div class="status" id="status" aria-live="polite"></div>
    <div class="top-actions">
      <a class="btn ghost" href="/?preview=1" target="_blank" rel="noopener" title="Unfinished items are highlighted; visitors don't see them">Preview site</a>
      <button class="btn" id="save" disabled>Save changes</button>
      <button class="link" id="menu-btn" aria-expanded="false" aria-controls="sidebar">Sections</button>
    </div>
  </header>
  <nav class="sidebar" id="sidebar" aria-label="Sections"></nav>
  <main class="editor" id="editor"></main>
</div>

<div class="toast" id="toast" role="status" hidden></div>
<script src="/admin/admin.js"></script>
</body>
</html>
